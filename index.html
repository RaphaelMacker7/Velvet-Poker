<style>

.deck{position:absolute;left:50%;top:21%;width:30px;transform:translateX(-50%);z-index:1}.deck .c{--w:30px;position:absolute;left:0;top:0}.deck .c:nth-child(2){top:-2px;left:-1px}.deck .c:nth-child(3){top:-4px;left:-2px}
.ctr{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:78%;z-index:1}
.pot{display:inline-flex;align-items:center;gap:6px;font:600 13px Inter;color:var(--gold2);background:#0009;border:1px solid #d8b46a44;border-radius:30px;padding:4px 12px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.brd{display:flex;gap:5px;justify-content:center;min-height:60px}.brd .c{--w:42px}

.chip{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#e0564f 35%,#fff 37% 50%,#e0564f 52%);border:1.5px dashed #fff9;vertical-align:middle}
.c{--w:36px;position:relative;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.14);font-size:calc(var(--w)*.4);background:linear-gradient(160deg,#fff,#ebe6d8);color:#14181a;box-shadow:0 3px 8px #000a,inset 0 0 0 1px #0002;flex:none}.c.rd{color:#c4302b}
.ci{position:absolute;top:6%;left:10%;font-weight:700;line-height:1;text-align:center}.cs{position:absolute;right:9%;bottom:3%;font-size:2.2em;line-height:1}
.c.bk{background:repeating-linear-gradient(45deg,#7a2433 0 3px,#5a1824 3px 6px);box-shadow:0 3px 8px #000a,inset 0 0 0 2px #f3efe4,inset 0 0 0 4px #7a2433}.c.bk *{display:none}
.c.deal{animation:fly .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:var(--d,0s)}.c.deal.bd{animation-name:flyflip;animation-duration:.85s}.c.rev{animation:rev .5s ease-out both}
@keyframes fly{from{transform:translate(var(--dx,0px),var(--dy,0px)) rotate(-30deg) scale(.5);opacity:0}25%{opacity:1}}
@keyframes flyflip{from{transform:translate(var(--dx,0px),var(--dy,0px)) rotateY(90deg) scale(.5);opacity:0}55%{transform:rotateY(90deg) scale(1.05);opacity:1}}@keyframes rev{from{transform:rotateY(90deg)}}
.s{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:2;transition:opacity .3s}.s.f{opacity:.38}
.s .c{--w:30px}.s.me .c{--w:46px}.hc{display:flex;justify-content:center;margin-bottom:-6px;position:relative;z-index:0}.hc .c+.c{margin-left:calc(var(--w)*-.2)}.hc .c:nth-child(odd){transform:rotate(-4deg)}.hc .c:nth-child(even){transform:rotate(4deg) translateY(2px)}
.pb{position:relative;z-index:1;display:flex;align-items:center;gap:6px;background:linear-gradient(160deg,#1b2327,#0d1214);border:1px solid #ffffff1a;border-radius:30px;padding:3px 10px 3px 3px;box-shadow:0 4px 14px #000a;overflow:hidden;transition:box-shadow .3s,border-color .3s}
.pb .av{width:26px;height:26px;font-size:12px}.pi{text-align:left;min-width:46px;max-width:64px}.nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch{font-size:11px;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1.1}

.s.t .pb{border-color:var(--gold);box-shadow:0 0 22px #d8b46aaa;animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 8px #d8b46a55}}.tb{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);animation:tb linear forwards}@keyframes tb{from{width:100%}to{width:0}}
.s.w .pb{border-color:var(--grn);box-shadow:0 0 26px #4fd08acc}.fl{position:absolute;left:50%;top:-30px;font:700 16px Inter;color:var(--grn);text-shadow:0 2px 8px #000;animation:rise 2s ease-out both}@keyframes rise{from{transform:translate(-50%,16px);opacity:0}20%{opacity:1}to{transform:translate(-50%,-26px);opacity:0}}
.al{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;font:600 11px Inter;background:var(--gold);color:#1a1405;padding:3px 9px;border-radius:12px;z-index:3}.al.pop{animation:pp .35s cubic-bezier(.2,1.5,.4,1) both}@keyframes pp{from{transform:translateX(-50%) scale(.3);opacity:0}}
.bt{position:absolute;transform:translate(-50%,-50%);z-index:1;font:600 11px Inter;background:#000a;border-radius:20px;padding:2px 8px 2px 4px;display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}.bt.pop{animation:pp2 .4s cubic-bezier(.2,1.5,.4,1) both}@keyframes pp2{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}
#ctl{max-width:520px;margin:6px auto 0;padding:0 14px calc(18px + env(safe-area-inset-bottom,0px))}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;height:50px;font-size:15px}
.hn{display:flex;justify-content:center;min-height:24px}.hn span{color:var(--gold2);font-size:12px;background:#d8b46a1a;border:1px solid #d8b46a44;border-radius:20px;padding:2px 12px;letter-spacing:.06em}
.q{height:38px!important;font-size:12px!important}.amt{flex:0 0 118px}.rg{flex:1;margin:0;padding:0;accent-color:var(--gold)}

</style></head><body><button id="mu" class="g">♪</button><div id="app"></div>
<script>
const $=q=>document.querySelector(q),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HN=['Carte haute','Paire','Double paire','Brelan','Quinte','Couleur','Full','Carré','Quinte flush'],RK=[...'23456789'].concat(['10','J','Q','K','A']),SU=['♠','♥','♦','♣'];
let peer,conns={},hostConn,isHost=false,myId,pin,name='',cfg,lobby=[],st=null,S=null,P=null,tAt=0,tm,mute=false,seen=new Map(),ac;
/* ---- sons ---- */
function snd(t){if(mute)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const n=ac.currentTime,T=(f,d,a=0,ty='sine',v=.15)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n+a);g.gain.exponentialRampToValueAtTime(.001,n+a+d);o.connect(g).connect(ac.destination);o.start(n+a);o.stop(n+a+d)};
({deal:()=>T(900,.06,0,'triangle'),chip:()=>{T(1800,.05,0,'square',.05);T(2400,.07,.05,'square',.04)},check:()=>T(220,.09,0,'triangle',.3),fold:()=>T(150,.2,0,'sawtooth',.06),turn:()=>{T(660,.12);T(880,.18,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>T(f,.3,i*.1))})[t]()}catch(e){}}
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'✕':'♪'};
/* ---- moteur de poker (exécuté uniquement chez l’hôte) ---- */
function shuffle(){const d=[...Array(52).keys()],r=new Uint32Array(52);crypto.getRandomValues(r);for(let i=51;i>0;i--){const j=r[i]%(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
function s5(a){const r=a.map(c=>c%13+2),fl=a.every(c=>(c/13|0)==(a[0]/13|0)),n={};r.forEach(x=>n[x]=(n[x]||0)+1);const g=Object.keys(n).map(Number).sort((x,y)=>n[y]-n[x]||y-x),o=g.map(x=>n[x]);let st=g.length==5&&g[0]-g[4]==4,rk=g;if(g.join()=='14,5,4,3,2'){st=true;rk=[5,4,3,2,1]}
const c=st&&fl?8:o[0]==4?7:o[0]==3&&o[1]==2?6:fl?5:st?4:o[0]==3?3:o[0]==2&&o[1]==2?2:o[0]==2?1:0;return c*759375+rk.reduce((s,x)=>s*15+x,0)}
function cmb(a,k){if(!k)return[[]];if(a.length<k)return[];const[h,...t]=a;return cmb(t,k-1).map(x=>[h,...x]).concat(cmb(t,k))}
function best(h,b,v){let m=0;const f=c=>{m=Math.max(m,s5(c))};if(v=='omaha')cmb(h,2).forEach(x=>cmb(b,3).forEach(y=>f(x.concat(y))));else cmb(h.concat(b),5).forEach(f);return m}
const nxA=(s,i)=>{const n=s.pl.length;for(let k=0;k<n;k++){i=(i+1)%n;const p=s.pl[i];if(!p.fold&&!p.allin&&!p.out)return i}return -1};
const pay=(p,n)=>{n=Math.max(0,Math.min(n,p.chips));p.chips-=n;p.bet+=n;p.inv+=n;if(!p.chips)p.allin=true};
function deal(s){s.pl.forEach(p=>{if(p.chips<=0||p.gone)p.out=true});const al=s.pl.filter(p=>!p.out);if(al.length<2){s.over=true;s.stage='over';s.turn=-1;return}
s.hand++;s.stage='pre';s.board=[];s.res=null;s.last='';s.snd='';let d=s.dealer;do d=(d+1)%s.pl.length;while(s.pl[d].out);s.dealer=d;s.deck=shuffle();const k=s.var=='omaha'?4:2;
s.pl.forEach(p=>{p.bet=p.inv=p.win=0;p.fold=p.out;p.allin=false;p.acted=false;p.al='';p.cards=p.out?[]:s.deck.splice(0,k)});
const nx=i=>{do i=(i+1)%s.pl.length;while(s.pl[i].out);return i},sbI=al.length==2?d:nx(d),bbI=nx(sbI);pay(s.pl[sbI],s.sb);pay(s.pl[bbI],s.bb);s.cb=s.bb;s.lr=s.bb;fin(s,bbI)}
function act(s,i,t,a){const p=s.pl[i];if(t=='fold'){p.fold=true;s.last=p.name+' se couche';s.snd='fold'}
else if(t=='call'){const n=Math.min(s.cb-p.bet,p.chips);pay(p,n);s.last=n?p.name+' suit '+n:p.name+' check';s.snd=n?'chip':'check'}
else{a=Math.min(Math.round(a),p.bet+p.chips);if(a>s.cb){const r=a-s.cb;if(r>=s.lr){s.lr=r;s.pl.forEach(q=>{if(q!==p)q.acted=false})}s.cb=a}pay(p,a-p.bet);s.last=p.name+(p.allin?' est à tapis ('+p.bet+')':' relance à '+p.bet);s.snd='chip'}
p.al=s.last.slice(p.name.length+1);p.acted=true;fin(s,i)}
function fin(s,i){const live=s.pl.filter(p=>!p.fold&&!p.out);if(live.length==1)return award(s);const able=live.filter(p=>!p.allin);
if(!able.every(p=>p.bet==s.cb&&(p.acted||able.length==1))){s.turn=nxA(s,i);return}
for(;;){s.pl.forEach(p=>{p.bet=0;p.acted=false;p.al=''});s.cb=0;s.lr=s.bb;if(s.stage=='river')return award(s);const k={pre:3,flop:1,turn:1}[s.stage];s.stage={pre:'flop',flop:'turn',turn:'river'}[s.stage];s.deck.shift();s.board.push(...s.deck.splice(0,k));if(able.length>1)break}
s.turn=nxA(s,s.dealer)}
function award(s){s.stage='show';s.turn=-1;const live=s.pl.filter(p=>!p.fold&&!p.out),lv=[...new Set(s.pl.filter(p=>p.inv>0).map(p=>p.inv))].sort((a,b)=>a-b);let pv=0;const hn={};
for(const L of lv){let pot=0;s.pl.forEach(p=>pot+=Math.max(0,Math.min(p.inv,L)-pv));pv=L;let el=live.filter(p=>p.inv>=L);if(!el.length)el=live;
const sc=el.map(p=>({p,v:live.length>1?best(p.cards,s.board,s.var):0})),top=Math.max(...sc.map(x=>x.v)),w=sc.filter(x=>x.v==top),sh=Math.floor(pot/w.length);w.forEach(x=>{x.p.chips+=sh;x.p.win+=sh;hn[x.p.id]=Math.floor(x.v/759375)});w[0].p.chips+=pot-sh*w.length;w[0].p.win+=pot-sh*w.length}
s.res=s.pl.filter(p=>p.win>0).map(p=>p.name+' remporte '+p.win+(live.length>1?' ('+HN[hn[p.id]]+')':''));s.snd='win'}
/* ---- réseau PeerJS : l’hôte est le serveur, chaque joueur ne reçoit que ses cartes ---- */
const view=h=>$('#app').innerHTML=h;
function pub(s,id){const c=JSON.parse(JSON.stringify(s));delete c.deck;c.tl=30;const sh=s.stage=='show'&&s.pl.filter(p=>!p.fold&&!p.out).length>1;c.pl.forEach(p=>{if(p.id!=id&&!(sh&&!p.fold))p.cards=p.cards.map(()=>-1)});return c}
function home(msg=''){try{peer&&peer.destroy()}catch(e){}conns={};st=S=P=null;isHost=false;view(`<div class="hero">${['♠','♥','♦','♣','♠','♥'].map((c,i)=>`<span class="fs${i%2?' r':''}" style="left:${6+i*16}%;top:${(i*37)%70+5}%;animation-delay:${-i*1.7}s">${c}</span>`).join('')}</div>
<div class="wrap"><div class="mk">♠</div><div class="logo">VELVET<small>POKER</small></div><div class="tag">Le poker privé entre amis · jusqu’à 10 joueurs</div>
<div class="gl"><h2>Votre pseudo</h2><input id="nm" maxlength="14" placeholder="Pseudo" value="${esc(name)}" style="margin:0"></div>
<div class="gl"><h2>Créer une table</h2><select id="vr"><option value="holdem">Texas Hold’em No-Limit</option><option value="omaha">Omaha No-Limit</option></select>
<select id="bl"><option value="10">Blinds 10 / 20</option><option value="25">Blinds 25 / 50</option><option value="50">Blinds 50 / 100</option></select>
<select id="sk"><option value="1000">Tapis 1 000</option><option value="2000">Tapis 2 000</option><option value="5000">Tapis 5 000</option></select><button id="cr" style="width:100%">Créer la table</button></div>
<div class="gl"><h2>Rejoindre une table</h2><input id="pn" inputmode="numeric" maxlength="6" placeholder="Code PIN à 6 chiffres"><button id="jn" class="g" style="width:100%">Rejoindre</button><div class="err" id="er">${msg}</div></div></div>`);
$('#cr').onclick=create;$('#jn').onclick=join}
const gn=()=>{name=$('#nm').value.trim();if(!name){$('#er').textContent='Entrez un pseudo.';return false}return true};
function create(){if(!gn())return;cfg={var:$('#vr').value,sb:+$('#bl').value,chips:+$('#sk').value};$('#er').textContent='Création…';mk()}
function mk(){pin=String(Math.floor(Math.random()*9e5+1e5));try{peer&&peer.destroy()}catch(e){}peer=new Peer('vp-'+pin);
peer.on('error',e=>e.type=='unavailable-id'?mk():home('Erreur réseau : '+e.type));
peer.on('open',()=>{isHost=true;myId='host';lobby=[{id:'host',name}];peer.on('connection',c=>{c.on('data',d=>onMsg(c,d));c.on('close',()=>drop(c.peer))});lob()})}
function join(){if(!gn())return;pin=$('#pn').value.trim();$('#er').textContent='Connexion…';peer=new Peer();
peer.on('error',e=>home(e.type=='peer-unavailable'?'Code PIN introuvable.':'Erreur réseau : '+e.type));
peer.on('open',id=>{myId=id;hostConn=peer.connect('vp-'+pin,{reliable:true});
hostConn.on('open',()=>hostConn.send({t:'join',name}));hostConn.on('close',()=>home('Connexion à l’hôte perdue.'));
hostConn.on('data',d=>{if(d.t=='lobby'){lobby=d.players;cfg=d.cfg;lob()}else if(d.t=='st')show(d.s);else if(d.t=='err')home(d.m)})})}
function onMsg(c,d){if(d.t=='join'){if(st)return c.send({t:'err',m:'La partie a déjà commencé.'}),setTimeout(()=>c.close(),300);if(lobby.length>=10)return c.send({t:'err',m:'Table complète (10 joueurs).'});
conns[c.peer]=c;lobby.push({id:c.peer,name:String(d.name).slice(0,14)});bcLobby()}else if(d.t=='act')hostAct(c.peer,d.a,d.amt)}
function bcLobby(){Object.values(conns).forEach(c=>c.open&&c.send({t:'lobby',players:lobby,cfg}));lob()}
function drop(id){delete conns[id];if(!st){lobby=lobby.filter(p=>p.id!=id);bcLobby()}else{const i=st.pl.findIndex(p=>p.id==id);if(i>=0){st.pl[i].gone=true;if(st.turn==i)hostAct(id,'fold');}}}
function hostAct(id,t,a){const s=st;if(!s||s.stage=='show'||s.over)return;const i=s.turn,p=s.pl[i];if(!p||p.id!=id)return;
if(t=='raise'){const mx=p.bet+p.chips;a=Math.min(Math.max(+a||0,Math.min(s.cb+s.lr,mx)),mx)}else if(t!='fold')t='call';act(s,i,t,a);push()}
function push(){clearTimeout(tm);Object.entries(conns).forEach(([id,c])=>c.open&&c.send({t:'st',s:pub(st,id)}));show(pub(st,'host'));if(st.over)return;
if(st.stage=='show'){const h=st.hand;tm=setTimeout(()=>{if(st.hand==h){deal(st);push()}},7000)}
else if(st.turn>=0){const p=st.pl[st.turn];tm=setTimeout(()=>hostAct(p.id,p.bet==st.cb?'call':'fold'),p.gone?400:30000)}}
function start(){st={var:cfg.var,sb:cfg.sb,bb:cfg.sb*2,dealer:-1,hand:0,pl:lobby.map(p=>({id:p.id,name:p.name,chips:cfg.chips,bet:0,inv:0})),last:''};deal(st);push()}
const hue=n=>{let x=0;for(const c of n)x=(x*31+c.charCodeAt(0))%360;return x},ini=n=>esc((n[0]||'?').toUpperCase());
function lob(){view(`<div class="hero"></div><div class="wrap"><div class="mk">♠</div><div class="logo">VELVET<small>POKER</small></div>
<div class="gl"><h2>Code PIN de la table</h2><div class="pin" id="pc">${[...pin].map(d=>`<b>${d}</b>`).join('')}</div><div class="info">Touchez pour copier · ${cfg.var=='omaha'?'Omaha':'Texas Hold’em'} · ${cfg.sb}/${cfg.sb*2}</div></div>
<div class="gl"><h2>Joueurs ${lobby.length}/10</h2>${lobby.map(p=>`<div class="pl"><div class="av" style="--h:${hue(p.name)}">${ini(p.name)}</div><span class="pn">${esc(p.name)}</span><span class="hb">${p.id=='host'?'Hôte':''}</span></div>`).join('')}
${isHost?`<button id="go" style="width:100%;margin-top:14px" ${lobby.length<2?'disabled':''}>Lancer la partie</button>`:'<div class="info" style="margin-top:14px">En attente de l’hôte…</div>'}</div></div>`);
$('#pc').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(pin);if(isHost)$('#go').onclick=start}
/* ---- table ---- */
const card=(c,k='')=>{if(c<0)return`<div class="c bk${k}"></div>`;const s=c/13|0;return`<div class="c${s==1||s==2?' rd':''}${k}"><span class="ci">${RK[c%13]}<br>${SU[s]}</span><span class="cs">${SU[s]}</span></div>`};
function cd(c,key,bd){const f=c>=0,was=seen.get(key);let k='';if(was===undefined)k=' deal'+(bd?' bd':'');else if(was===false&&f)k=' rev';seen.set(key,f);return card(c,k)}
const nw=k=>{const x=!seen.has(k);seen.set(k,1);return x},fl=a=>a.replace('se couche','Couché').replace('relance à ','Relance ').replace('est à tapis (','Tapis ').replace(')','').replace(/^./,c=>c.toUpperCase());
function show(s){P=S;S=s;tAt=Date.now();table()}
function table(){const s=S,n=s.pl.length,m=Math.max(0,s.pl.findIndex(p=>p.id==myId)),me=s.pl[m],sh=s.stage=='show',my=s.turn==m&&!sh&&!s.over,pot=s.pl.reduce((a,p)=>a+p.inv,0);let bets='';
const seats=s.pl.map((p,j)=>{const a=Math.PI/2+((j-m+n)%n)*2*Math.PI/n,x=50+42*Math.cos(a),y=50+44*Math.sin(a);
if(p.bet)bets+=`<div class="bt${nw('b'+s.hand+s.stage+j+p.bet)?' pop':''}" style="left:${x+(50-x)*.4}%;top:${y+(50-y)*.4}%"><i class="chip"></i>${p.bet}</div>`;
return`<div class="s${j==m?' me':''}${p.fold||p.out?' f':''}${p.win>0?' w':''}${s.turn==j&&!s.over?' t':''}" style="left:${x}%;top:${y}%">${p.al&&!sh?`<div class="al${nw('a'+s.hand+s.stage+j+p.al)?' pop':''}">${fl(p.al)}</div>`:''}<div class="hc">${p.cards.map((c,i)=>cd(c,s.hand+'-'+j+'-'+i)).join('')}</div>
<div class="pb"><div class="av" style="--h:${hue(p.name)}">${ini(p.name)}${s.dealer==j?'<b class="db">D</b>':''}</div><div class="pi"><div class="nm">${esc(p.name)}</div><div class="ch">${p.out?(p.gone?'Parti':'Éliminé'):p.allin?'TAPIS':p.chips.toLocaleString('fr-FR')}</div></div>${s.turn==j&&!s.over?`<i class="tb" style="animation-duration:${S.tl}s"></i>`:''}</div>${p.win>0?`<div class="fl">+${p.win}</div>`:''}</div>`}).join('');
let ctl='';if(s.over){const w=s.pl.find(p=>!p.out);ctl=`<div class="info" style="color:var(--gold2);font-size:17px">🏆 ${esc(w?w.name:'')} remporte la partie</div><div class="row"><button id="mn">Retour au menu</button></div>`}
else if(my){const call=Math.min(s.cb-me.bet,me.chips),mx=me.bet+me.chips,mn=Math.min(s.cb+s.lr,mx),pt=pot+call,qb=[['½ pot',.5],['¾ pot',.75],['Pot',1]].map(([l,f])=>`<button class="q g" data-v="${Math.min(mx,Math.max(mn,s.cb+Math.round(pt*f)))}">${l}</button>`).join('')+`<button class="q g" data-v="${mx}">Tapis</button>`;
ctl=`<div class="row"><button class="r" id="fo">Se coucher</button><button class="g" id="ca">${call?'Suivre '+call:'Check'}</button></div>${mx>s.cb?`<div class="row">${qb}</div><div class="row"><input type="range" class="rg" id="rg" min="${mn}" max="${mx}" step="${Math.min(s.sb,Math.max(1,mx-mn))}" value="${mn}"><button id="rb" class="amt">${mn==mx?'Tapis '+mn:'Relancer '+mn}</button></div>`:''}`}
else ctl=`<div class="info">${sh?'Main suivante dans un instant…':s.turn>=0?'Au tour de '+esc(s.pl[s.turn].name):''}</div>`;
const hn=me.cards.length&&me.cards[0]>=0&&!me.fold&&s.board.length>=3?HN[Math.floor(best(me.cards,s.board,s.var)/759375)]:'';
view(`<div id="hud"><span>Main <b>${s.hand}</b></span><span>Blinds <b>${s.sb}/${s.bb}</b></span><span><b>${s.var=='omaha'?'Omaha':'Hold’em'}</b></span></div>
<div id="tb"><div class="rail"></div><div class="felt"></div><div class="deck" id="dk"><div class="c bk"></div><div class="c bk"></div><div class="c bk"></div></div>
<div class="ctr"><div class="pot"><i class="chip"></i>POT ${pot.toLocaleString('fr-FR')}</div><div class="brd">${s.board.map((c,i)=>cd(c,s.hand+'-b'+i,1)).join('')}</div>${s.res?`<div class="bn">${esc(s.res.join(' · '))}</div>`:''}</div>${bets}${seats}</div>
<div id="ctl"><div class="hn">${hn?`<span>${hn}</span>`:''}</div>${ctl}</div>`);
const go=(t,a)=>isHost?hostAct('host',t,a):hostConn.send({t:'act',a:t,amt:a});
if($('#fo')){$('#fo').onclick=()=>go('fold');$('#ca').onclick=()=>go('call');const rg=$('#rg');if(rg){rg.oninput=()=>$('#rb').textContent=+rg.value==+rg.max?'Tapis '+rg.value:'Relancer '+rg.value;$('#rb').onclick=()=>go('raise',+rg.value);document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{rg.value=b.dataset.v;rg.oninput()})}}
if($('#mn'))$('#mn').onclick=()=>location.reload();
const dk=$('#dk').getBoundingClientRect(),ds=[...document.querySelectorAll('.c.deal')].map(e=>[e,e.getBoundingClientRect()]);
ds.forEach(([e,r],i)=>{e.style.setProperty('--dx',dk.left+dk.width/2-r.left-r.width/2+'px');e.style.setProperty('--dy',dk.top+dk.height/2-r.top-r.height/2+'px');e.style.setProperty('--d',i*.13+'s');setTimeout(()=>snd('deal'),i*130)});
if(P&&P.last!=s.last&&s.snd)snd(s.snd);if(sh&&(!P||P.stage!='show'))setTimeout(()=>snd('win'),400);if(my&&(!P||P.turn!=s.turn))snd('turn')}
home();
</script></body></html>
