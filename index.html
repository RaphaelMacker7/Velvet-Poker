<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Velvet Poker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0b0f0d;--panel:#141a17;--line:#26302b;--tx:#eef2ef;--mu:#8b9a92;--gold:#c9a45c;--felt:#0f4a35;--felt2:#0a3225;--red:#d4504a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif}
.logo{font:700 34px 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:var(--gold);text-align:center}
.wrap{max-width:440px;margin:0 auto;padding:28px 18px}.card-p{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
h2{margin:0 0 12px;font:600 13px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
input,select{width:100%;background:#0e1311;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:12px;font:inherit;margin-bottom:10px}
button{font:600 14px Inter;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--gold);color:#1a1405;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.g{background:#1d2622;color:var(--tx);border:1px solid var(--line)}button.r{background:#5a2523;color:#fff}button:disabled{opacity:.4;cursor:default}
.pin{font:700 44px 'Cormorant Garamond',serif;letter-spacing:.2em;text-align:center;color:var(--gold);cursor:pointer;margin:6px 0}
.pl{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.err{color:var(--red);font-size:13px;min-height:18px}
#tb{position:relative;width:100%;max-width:560px;aspect-ratio:3/4.1;margin:0 auto;max-height:68vh}
.felt{position:absolute;inset:7% 5%;border-radius:50%;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));border:6px solid #2a1d12;box-shadow:inset 0 0 40px #0008,0 10px 40px #000a}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:70%}
.pot{font:600 13px Inter;color:var(--gold);letter-spacing:.08em;margin-bottom:6px}.brd{display:flex;gap:4px;justify-content:center;min-height:50px}
.c{width:34px;height:48px;border-radius:5px;background:#f6f4ee;color:#111;font:700 15px Inter;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px #0007}
.c.rd{color:#c0332d}.c.bk{background:repeating-linear-gradient(45deg,#6b1f2a,#6b1f2a 4px,#541720 4px,#541720 8px);border:2px solid #f6f4ee}
.c.deal{animation:dl .45s cubic-bezier(.2,.8,.2,1) both}@keyframes dl{from{transform:translateY(-60px) scale(.6) rotate(-14deg);opacity:0}}
.s{position:absolute;transform:translate(-50%,-50%);width:92px;text-align:center;transition:opacity .3s}
.sb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;margin-top:2px;transition:box-shadow .3s,border-color .3s}
.s.t .sb{border-color:var(--gold);box-shadow:0 0 18px #c9a45c88;animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 6px #c9a45c44}}
.s.f{opacity:.35}.s.w .sb{border-color:#5fd08a;box-shadow:0 0 20px #5fd08aaa}
.nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch{font-size:11px;color:var(--gold)}
.hc{display:flex;gap:2px;justify-content:center}.hc .c{width:26px;height:37px;font-size:12px}
.bt{font-size:11px;color:#fff;background:#0007;border-radius:20px;padding:1px 8px;display:inline-block;margin-top:3px;animation:dl .3s both}
.dl{background:#fff;color:#000;border-radius:50%;width:16px;height:16px;display:inline-block;font-size:10px;line-height:16px;font-weight:700;margin-left:4px}
#ctl{max-width:560px;margin:8px auto;padding:0 14px}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
.info{text-align:center;color:var(--mu);font-size:13px;min-height:20px}
#mu{position:fixed;top:10px;right:12px;z-index:5;padding:8px 10px}.hn{color:var(--gold);font-size:13px;text-align:center;margin-top:4px;min-height:18px}
</style></head><body><button id="mu" class="g">♪</button><div id="app"></div>
<script>
const $=q=>document.querySelector(q),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HN=['Carte haute','Paire','Double paire','Brelan','Quinte','Couleur','Full','Carré','Quinte flush'],RK=[...'23456789'].concat(['10','J','Q','K','A']),SU=['♠','♥','♦','♣'];
let peer,conns={},hostConn,isHost=false,myId,pin,name='',cfg,lobby=[],st=null,S=null,P=null,tAt=0,tm,mute=false,seen=new Set(),ac;
/* ---- sons ---- */
function snd(t){if(mute)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const n=ac.currentTime,T=(f,d,a=0,ty='sine',v=.15)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n+a);g.gain.exponentialRampToValueAtTime(.001,n+a+d);o.connect(g).connect(ac.destination);o.start(n+a);o.stop(n+a+d)};
({deal:()=>T(900,.06,0,'triangle'),chip:()=>{T(1800,.05,0,'square',.05);T(2400,.07,.05,'square',.04)},check:()=>T(220,.09,0,'triangle',.3),fold:()=>T(150,.2,0,'sawtooth',.06),turn:()=>{T(660,.12);T(880,.18,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>T(f,.3,i*.1))})[t]()}catch(e){}}
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'✕':'♪'};
/* ---- moteur de poker (exécuté uniquement chez l’hôte) ---- */
function shuffle(){const d=[...Array(52).keys()],r=new Uint32Array(52);crypto.getRandomValues(r);for(let i=51;i>0;i--){const j=r[i]%(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
function s5(a){const r=a.map(c=>c%13+2),fl=a.every(c=>(c/13|0)==(a[0]/13|0)),n={};r.forEach(x=>n[x]=(n[x]||0)+1);const g=Object.keys(n).map(Number).sort((x,y)=>n[y]-n[x]||y-x),o=g.map(x=>n[x]);let st=g.length==5&&g[0]-g[4]==4,rk=g;if(g.join()=='14,5,4,3,2'){st=true;rk=[5,4,3,2,1]}
const c=st&&fl?8:o[0]==4?7:o[0]==3&&o[1]==2?6:fl?5:st?4:o[0]==3?3:o[0]==2&&o[1]==2?2:o[0]==2?1:0;return c*759375+rk.reduce((s,x)=>s*15+x,0)}
function cmb(a,k){if(!k)return[[]];if(a.length<k)return[];const[h,...t]=a;return cmb(t,k-1).map(x=>[h,...x]).concat(cmb(t,k))}
function best(h,b,v){let m=0;const f=c=>{m=Math.max(m,s5(c))};if(v=='omaha')cmb(h,2).forEach(x=>cmb(b,3).forEach(y=>f(x.concat(y))));else cmb(h.concat(b),5).forEach(f);return m}
const nxA=(s,i)=>{const n=s.pl.length;for(let k=0;k<n;k++){i=(i+1)%n;const p=s.pl[i];if(!p.fold&&!p.allin&&!p.out)return i}return -1};
const pay=(p,n)=>{n=Math.max(0,Math.min(n,p.chips));p.chips-=n;p.bet+=n;p.inv+=n;if(!p.chips)p.allin=true};
function deal(s){s.pl.forEach(p=>{if(p.chips<=0||p.gone)p.out=true});const al=s.pl.filter(p=>!p.out);if(al.length<2){s.over=true;s.stage='over';s.turn=-1;return}
s.hand++;s.stage='pre';s.board=[];s.res=null;s.last='';s.snd='';let d=s.dealer;do d=(d+1)%s.pl.length;while(s.pl[d].out);s.dealer=d;s.deck=shuffle();const k=s.var=='omaha'?4:2;
s.pl.forEach(p=>{p.bet=p.inv=p.win=0;p.fold=p.out;p.allin=false;p.acted=false;p.cards=p.out?[]:s.deck.splice(0,k)});
const nx=i=>{do i=(i+1)%s.pl.length;while(s.pl[i].out);return i},sbI=al.length==2?d:nx(d),bbI=nx(sbI);pay(s.pl[sbI],s.sb);pay(s.pl[bbI],s.bb);s.cb=s.bb;s.lr=s.bb;fin(s,bbI)}
function act(s,i,t,a){const p=s.pl[i];if(t=='fold'){p.fold=true;s.last=p.name+' se couche';s.snd='fold'}
else if(t=='call'){const n=Math.min(s.cb-p.bet,p.chips);pay(p,n);s.last=n?p.name+' suit '+n:p.name+' check';s.snd=n?'chip':'check'}
else{a=Math.min(Math.round(a),p.bet+p.chips);if(a>s.cb){const r=a-s.cb;if(r>=s.lr){s.lr=r;s.pl.forEach(q=>{if(q!==p)q.acted=false})}s.cb=a}pay(p,a-p.bet);s.last=p.name+(p.allin?' est à tapis ('+p.bet+')':' relance à '+p.bet);s.snd='chip'}
p.acted=true;fin(s,i)}
function fin(s,i){const live=s.pl.filter(p=>!p.fold&&!p.out);if(live.length==1)return award(s);const able=live.filter(p=>!p.allin);
if(!able.every(p=>p.bet==s.cb&&(p.acted||able.length==1))){s.turn=nxA(s,i);return}
for(;;){s.pl.forEach(p=>{p.bet=0;p.acted=false});s.cb=0;s.lr=s.bb;if(s.stage=='river')return award(s);const k={pre:3,flop:1,turn:1}[s.stage];s.stage={pre:'flop',flop:'turn',turn:'river'}[s.stage];s.deck.shift();s.board.push(...s.deck.splice(0,k));if(able.length>1)break}
s.turn=nxA(s,s.dealer)}
function award(s){s.stage='show';s.turn=-1;const live=s.pl.filter(p=>!p.fold&&!p.out),lv=[...new Set(s.pl.filter(p=>p.inv>0).map(p=>p.inv))].sort((a,b)=>a-b);let pv=0;const hn={};
for(const L of lv){let pot=0;s.pl.forEach(p=>pot+=Math.max(0,Math.min(p.inv,L)-pv));pv=L;let el=live.filter(p=>p.inv>=L);if(!el.length)el=live;
const sc=el.map(p=>({p,v:live.length>1?best(p.cards,s.board,s.var):0})),top=Math.max(...sc.map(x=>x.v)),w=sc.filter(x=>x.v==top),sh=Math.floor(pot/w.length);w.forEach(x=>{x.p.chips+=sh;x.p.win+=sh;hn[x.p.id]=Math.floor(x.v/759375)});w[0].p.chips+=pot-sh*w.length;w[0].p.win+=pot-sh*w.length}
s.res=s.pl.filter(p=>p.win>0).map(p=>p.name+' remporte '+p.win+(live.length>1?' ('+HN[hn[p.id]]+')':''));s.snd='win'}
/* ---- réseau PeerJS : l’hôte est le serveur, chaque joueur ne reçoit que ses cartes ---- */
const view=h=>$('#app').innerHTML=h;
function pub(s,id){const c=JSON.parse(JSON.stringify(s));delete c.deck;c.tl=30;const sh=s.stage=='show'&&s.pl.filter(p=>!p.fold&&!p.out).length>1;c.pl.forEach(p=>{if(p.id!=id&&!(sh&&!p.fold))p.cards=p.cards.map(()=>-1)});return c}
function home(msg=''){try{peer&&peer.destroy()}catch(e){}conns={};st=S=P=null;isHost=false;view(`<div class="wrap"><div class="logo">VELVET POKER</div><div class="info">Poker privé entre amis</div>
<div class="card-p"><h2>Votre pseudo</h2><input id="nm" maxlength="14" placeholder="Pseudo" value="${esc(name)}"></div>
<div class="card-p"><h2>Créer une table</h2><select id="vr"><option value="holdem">Texas Hold’em No-Limit</option><option value="omaha">Omaha No-Limit</option></select>
<select id="bl"><option value="10">Blinds 10 / 20</option><option value="25">Blinds 25 / 50</option><option value="50">Blinds 50 / 100</option></select>
<select id="sk"><option value="1000">Tapis 1 000</option><option value="2000">Tapis 2 000</option><option value="5000">Tapis 5 000</option></select><button id="cr" style="width:100%">Créer et générer le code PIN</button></div>
<div class="card-p"><h2>Rejoindre</h2><input id="pn" inputmode="numeric" maxlength="6" placeholder="Code PIN à 6 chiffres"><button id="jn" class="g" style="width:100%">Rejoindre la table</button><div class="err" id="er">${msg}</div></div></div>`);
$('#cr').onclick=create;$('#jn').onclick=join}
const gn=()=>{name=$('#nm').value.trim();if(!name){$('#er').textContent='Entrez un pseudo.';return false}return true};
function create(){if(!gn())return;cfg={var:$('#vr').value,sb:+$('#bl').value,chips:+$('#sk').value};$('#er').textContent='Création…';mk()}
function mk(){pin=String(Math.floor(Math.random()*9e5+1e5));try{peer&&peer.destroy()}catch(e){}peer=new Peer('vp-'+pin);
peer.on('error',e=>e.type=='unavailable-id'?mk():home('Erreur réseau : '+e.type));
peer.on('open',()=>{isHost=true;myId='host';lobby=[{id:'host',name}];peer.on('connection',c=>{c.on('data',d=>onMsg(c,d));c.on('close',()=>drop(c.peer))});lob()})}
function join(){if(!gn())return;pin=$('#pn').value.trim();$('#er').textContent='Connexion…';peer=new Peer();
peer.on('error',e=>home(e.type=='peer-unavailable'?'Code PIN introuvable.':'Erreur réseau : '+e.type));
peer.on('open',id=>{myId=id;hostConn=peer.connect('vp-'+pin,{reliable:true});
hostConn.on('open',()=>hostConn.send({t:'join',name}));hostConn.on('close',()=>home('Connexion à l’hôte perdue.'));
hostConn.on('data',d=>{if(d.t=='lobby'){lobby=d.players;cfg=d.cfg;lob()}else if(d.t=='st')show(d.s);else if(d.t=='err')home(d.m)})})}
function onMsg(c,d){if(d.t=='join'){if(st)return c.send({t:'err',m:'La partie a déjà commencé.'}),setTimeout(()=>c.close(),300);if(lobby.length>=10)return c.send({t:'err',m:'Table complète (10 joueurs).'});
conns[c.peer]=c;lobby.push({id:c.peer,name:String(d.name).slice(0,14)});bcLobby()}else if(d.t=='act')hostAct(c.peer,d.a,d.amt)}
function bcLobby(){Object.values(conns).forEach(c=>c.open&&c.send({t:'lobby',players:lobby,cfg}));lob()}
function drop(id){delete conns[id];if(!st){lobby=lobby.filter(p=>p.id!=id);bcLobby()}else{const i=st.pl.findIndex(p=>p.id==id);if(i>=0){st.pl[i].gone=true;if(st.turn==i)hostAct(id,'fold');}}}
function hostAct(id,t,a){const s=st;if(!s||s.stage=='show'||s.over)return;const i=s.turn,p=s.pl[i];if(!p||p.id!=id)return;
if(t=='raise'){const mx=p.bet+p.chips;a=Math.min(Math.max(+a||0,Math.min(s.cb+s.lr,mx)),mx)}else if(t!='fold')t='call';act(s,i,t,a);push()}
function push(){clearTimeout(tm);Object.entries(conns).forEach(([id,c])=>c.open&&c.send({t:'st',s:pub(st,id)}));show(pub(st,'host'));if(st.over)return;
if(st.stage=='show'){const h=st.hand;tm=setTimeout(()=>{if(st.hand==h){deal(st);push()}},7000)}
else if(st.turn>=0){const p=st.pl[st.turn];tm=setTimeout(()=>hostAct(p.id,p.bet==st.cb?'call':'fold'),p.gone?400:30000)}}
function start(){st={var:cfg.var,sb:cfg.sb,bb:cfg.sb*2,dealer:-1,hand:0,pl:lobby.map(p=>({id:p.id,name:p.name,chips:cfg.chips,bet:0,inv:0})),last:''};deal(st);push()}
function lob(){view(`<div class="wrap"><div class="logo">VELVET POKER</div><div class="card-p"><h2>Code PIN de la table</h2><div class="pin" id="pc">${pin}</div><div class="info">Touchez pour copier · ${cfg.var=='omaha'?'Omaha':'Texas Hold’em'} · ${cfg.sb}/${cfg.sb*2}</div></div>
<div class="card-p"><h2>Joueurs ${lobby.length}/10</h2>${lobby.map(p=>`<div class="pl"><span>${esc(p.name)}</span><span style="color:var(--gold)">${p.id=='host'?'Hôte':''}</span></div>`).join('')}
${isHost?`<button id="go" style="width:100%;margin-top:14px" ${lobby.length<2?'disabled':''}>Lancer la partie</button>`:'<div class="info" style="margin-top:14px">En attente de l’hôte…</div>'}</div></div>`);
$('#pc').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(pin);if(isHost)$('#go').onclick=start}
/* ---- table ---- */
const card=(c,k)=>{if(c<0)return`<div class="c bk${k}"></div>`;const r=c%13,s=c/13|0;return`<div class="c${s==1||s==2?' rd':''}${k}"><span>${RK[r]}</span><span>${SU[s]}</span></div>`};
function cd(c,key){const n=!seen.has(key);seen.add(key);return card(c,n?' deal':'')}
function show(s){P=S;S=s;tAt=Date.now();table()}
function table(){const s=S,n=s.pl.length,m=Math.max(0,s.pl.findIndex(p=>p.id==myId)),me=s.pl[m],my=s.turn==m&&s.stage!='show'&&!s.over,pot=s.pl.reduce((a,p)=>a+p.inv,0);
const seats=s.pl.map((p,j)=>{const a=Math.PI/2+((j-m+n)%n)*2*Math.PI/n,x=50+41*Math.cos(a),y=50+43*Math.sin(a);
return`<div class="s${s.turn==j&&!s.over?' t':''}${p.fold||p.out?' f':''}${p.win>0?' w':''}" style="left:${x}%;top:${y}%"><div class="hc">${p.cards.map((c,i)=>cd(c,s.hand+'-'+j+'-'+i)).join('')}</div><div class="sb"><div class="nm">${esc(p.name)}${s.dealer==j?'<span class="dl">D</span>':''}</div><div class="ch">${p.out?(p.gone?'Parti':'Éliminé'):p.allin?'TAPIS':p.chips}</div></div>${p.bet?`<div class="bt">${p.bet}</div>`:''}</div>`}).join('');
let ctl='';if(s.over){const w=s.pl.find(p=>!p.out);ctl=`<div class="info" style="color:var(--gold);font-size:16px">🏆 ${esc(w?w.name:'')} remporte la partie</div><div class="row"><button id="mn">Retour au menu</button></div>`}
else if(my){const call=Math.min(s.cb-me.bet,me.chips),mx=me.bet+me.chips,mn=Math.min(s.cb+s.lr,mx);ctl=`<div class="row"><button class="r" id="fo">Se coucher</button><button class="g" id="ca">${call?'Suivre '+call:'Check'}</button></div>${mx>s.cb?`<div class="row"><input type="range" id="rg" min="${mn}" max="${mx}" step="${Math.min(s.sb,Math.max(1,mx-mn))}" value="${mn}" style="margin:0;padding:0"><button id="rb" style="flex:0 0 130px">${mn==mx?'Tapis '+mn:'Relancer '+mn}</button></div>`:''}`}
else ctl=`<div class="info">${s.stage=='show'?'Main suivante dans un instant…':s.turn>=0?'Au tour de '+esc(s.pl[s.turn].name):''}</div>`;
const hn=me.cards.length&&me.cards[0]>=0&&!me.fold&&s.board.length>=3?HN[Math.floor(best(me.cards,s.board,s.var)/759375)]:'';
view(`<div style="padding-top:44px"><div id="tb"><div class="felt"></div><div class="ctr"><div class="pot">POT ${pot}</div><div class="brd">${s.board.map((c,i)=>cd(c,s.hand+'-b'+i)).join('')}</div></div>${seats}</div>
<div id="ctl"><div class="info" style="color:var(--tx)">${esc(s.res?s.res.join(' · '):s.last)}</div><div class="hn">${hn}<span id="cdn" style="color:var(--mu)"></span></div>${ctl}</div></div>`);
const go=(t,a)=>isHost?hostAct('host',t,a):hostConn.send({t:'act',a:t,amt:a});
if($('#fo')){$('#fo').onclick=()=>go('fold');$('#ca').onclick=()=>go('call');if($('#rg')){const rg=$('#rg');rg.oninput=()=>$('#rb').textContent=+rg.value==+rg.max?'Tapis '+rg.value:'Relancer '+rg.value;$('#rb').onclick=()=>go('raise',+rg.value)}}
if($('#mn'))$('#mn').onclick=()=>location.reload();
if(!P||P.hand!=s.hand||P.board.length!=s.board.length)snd('deal');else if(P.last!=s.last&&s.snd)snd(s.snd);if(s.stage=='show'&&(!P||P.stage!='show'))snd('win');if(my&&(!P||P.turn!=s.turn))snd('turn')}
setInterval(()=>{const e=$('#cdn');if(e&&S&&S.turn>=0&&S.stage!='show'&&!S.over)e.textContent=' · '+Math.max(0,S.tl-Math.round((Date.now()-tAt)/1e3))+' s';else if(e)e.textContent=''},1000);
home();
</script></body></html>
