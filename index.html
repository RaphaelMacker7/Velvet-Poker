<meta name="apple-mobile-web-app-title" content="Velvet Poker">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#07090b;--line:#262f34;--tx:#f5f3ec;--mu:#97a3a9;--gold:#d8b46a;--gold2:#f3dca0;--red:#e0564f;--grn:#4fd08a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}html,body{overscroll-behavior:none;overflow-x:hidden;-webkit-text-size-adjust:100%}html,body{margin:0;min-height:100%;color:var(--tx);font:500 15px/1.35 Outfit,system-ui,sans-serif;background:radial-gradient(90% 55% at 50% 24%,#183428 0%,#0b1412 52%,#050708 100%);user-select:none}
.hero{position:fixed;inset:0;overflow:hidden;pointer-events:none}.fs{position:absolute;font-size:64px;color:#d8b46a14;animation:fl 9s ease-in-out infinite}.fs.r{color:#e0564f12}@keyframes fl{50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:30px 18px 40px}.mk{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#1a1405;background:linear-gradient(160deg,var(--gold2),var(--gold));box-shadow:0 0 34px #d8b46a66}
.logo{font:700 40px 'Cormorant Garamond',Georgia,serif;letter-spacing:.2em;text-align:center;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}.logo small{display:block;font:700 15px Outfit;letter-spacing:.7em;margin-top:2px;text-indent:.7em}
.tag{text-align:center;color:var(--mu);font-size:14px;margin:10px 0 6px}
.gl{background:linear-gradient(160deg,#ffffff0d,#ffffff05);border:1px solid #ffffff14;border-radius:18px;padding:20px;margin-top:14px;backdrop-filter:blur(10px);box-shadow:0 10px 30px #0006}
h2{margin:0 0 12px;font:700 12px Outfit;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
input,select{width:100%;background:#0a0e0d;border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:13px;font:600 16px Outfit;margin-bottom:10px;outline:0;transition:border-color .2s;user-select:text}input:focus,select:focus{border-color:var(--gold)}
button{font:700 15px Outfit;letter-spacing:.02em;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;box-shadow:0 4px 14px #d8b46a33;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.95)}
button.g{background:#1a2125;color:var(--tx);border:1px solid #2d383d;box-shadow:none}button.r{background:linear-gradient(180deg,#a03e3a,#6a2623);color:#fff;box-shadow:none}button.gr{background:linear-gradient(180deg,#38b57c,#1f7a52);color:#fff;box-shadow:none}button:disabled{opacity:.4}
.pin{display:flex;gap:8px;justify-content:center;margin:6px 0 10px;cursor:pointer}.pin b{width:42px;height:56px;display:grid;place-items:center;font:700 32px 'Cormorant Garamond',serif;color:var(--gold2);background:#0a0e0d;border:1px solid #d8b46a55;border-radius:10px}
.pl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10;animation:up .4s both}.pn{flex:1;font-weight:600}.hb{color:var(--gold);font-size:13px;font-weight:600}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.av{--h:150;position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 15px Outfit;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 55% 45%),hsl(var(--h) 60% 25%));box-shadow:inset 0 0 0 2px #ffffff30;flex:none}
.err{color:var(--red);font-size:14px;min-height:18px;font-weight:600}.info{text-align:center;color:var(--mu);font-size:14px;min-height:20px;font-weight:600}
#hud{display:flex;justify-content:center;gap:16px;padding:52px 12px 0;font:600 12px Outfit;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}#hud b{color:var(--gold);font-weight:800}
#tb{position:relative;width:100%;max-width:520px;aspect-ratio:3/3.75;margin:34px auto 0;max-height:52vh}
.rail{position:absolute;inset:8% 3%;border-radius:50%;background:repeating-linear-gradient(45deg,#ffffff06 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 18%,#4d372a,#1b110c 72%);box-shadow:0 0 0 3px #2b1a0d,0 0 0 4px #7a5a33,0 24px 55px #000d,inset 0 3px 4px #ffffff30,inset 0 -8px 14px #000b}.rail:before{content:'';position:absolute;inset:5px;border-radius:50%;border:1.5px dashed #d8b46a66}
.felt{position:absolute;inset:8% 3%;margin:17px;border-radius:50%;background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#00000010 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 36%,#2b9468 0%,#146446 44%,#0b3b2a 78%,#06241a 100%);box-shadow:inset 0 0 60px #000c,inset 0 6px 14px #0008,inset 0 0 0 2px #00000066;overflow:hidden}

function bake(){const sr=ac.sampleRate,R=Math.random,TP=Math.PI*2,rr=(a,b)=>a+R()*(b-a);
const mk=(d,fn)=>{const n=Math.ceil(sr*d),b=ac.createBuffer(1,n,sr),x=b.getChannelData(0);fn(x);let m=1e-6;for(let i=0;i<n;i++)m=Math.max(m,Math.abs(x[i]));for(let i=0;i<n;i++)x[i]=x[i]/m*.95;return b};
/* friction du papier : bruit filtré passe-bande à fréquence glissante, modulé par un grain lent */
const sw=(x,t0,d,f1,f2,q,a,tau)=>{const i0=t0*sr|0,n=d*sr|0;let lo=0,bd=0,g=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr,f=f1+(f2-f1)*Math.min(1,t/d),F=Math.min(.8,2*Math.sin(Math.PI*f/sr));g+=((R()*2-1)-g)*.12;const hi=(R()*2-1)-lo-q*bd;bd+=F*hi;lo+=F*bd;x[i0+i]+=bd*a*Math.min(1,t/.003)*Math.exp(-t/tau)*(.55+.9*Math.abs(g))}};
/* claquement sec du bord de la carte */
const sn=(x,t0,a)=>{const i0=t0*sr|0;let pv=0;for(let i=0;i<.012*sr&&i0+i<x.length;i++){const v=R()*2-1;x[i0+i]+=(v-pv)*a*Math.exp(-i/sr/.003);pv=v}};
/* choc mat sur le feutre / la table */
const th=(x,t0,a,f0,tau)=>{const i0=t0*sr|0,n=tau*7*sr|0;let ph=0,lp=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr;ph+=TP*f0*(1-.4*Math.min(1,t/.04))/sr;lp+=((R()*2-1)-lp)*.12;x[i0+i]+=a*Math.exp(-t/tau)*(Math.sin(ph)+2.2*lp)}};
/* jeton en céramique : partiels inharmoniques très courts + tic */
const ev=(t,d)=>Math.pow(Math.sin(Math.PI*Math.min(1,t/d)),.8);
/* glissement du papier sur le feutre : bruit filtré, enveloppe en cloche, grain irrégulier */
const sl=(x,t0,d,f1,f2,a)=>{const i0=t0*sr|0,n=d*sr|0;let lo=0,bd=0,g=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr,f=f1+(f2-f1)*t/d,F=Math.min(.8,2*Math.sin(Math.PI*f/sr));g+=((R()*2-1)-g)*.08;const hi=(R()*2-1)-lo-.9*bd;bd+=F*hi;lo+=F*bd;x[i0+i]+=bd*a*ev(t,d)*(.5+1.1*Math.abs(g))}};
/* choc amorti sur le feutre */
const pt=(x,t0,a,f0)=>{const i0=t0*sr|0,n=.09*sr|0;let lp=0,ph=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr;lp+=((R()*2-1)-lp)*.06;ph+=TP*f0*(1-.35*Math.min(1,t/.03))/sr;x[i0+i]+=a*Math.exp(-t/.014)*(Math.sin(ph)*.8+lp*3)}};
/* phalange sur le bois du rail */
const kn=(x,t0,a,f)=>{const i0=t0*sr|0,n=.2*sr|0;let lp=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr;lp+=((R()*2-1)-lp)*.35;x[i0+i]+=a*(Math.sin(TP*f*t)*Math.exp(-t/.035)+.5*Math.sin(TP*f*2.4*t)*Math.exp(-t/.02)+.5*Math.sin(TP*f*4.1*t)*Math.exp(-t/.01)+lp*Math.exp(-t/.003))}};

const kw=(x,t0,a,f)=>{const i0=t0*sr|0,n=.12*sr|0;let lp=0,l2=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr,w=R()*2-1;lp+=(w-lp)*.5;l2+=(w-l2)*.1;x[i0+i]+=a*((lp-l2)*1.5*Math.exp(-t/.0028)+Math.sin(TP*f*t)*Math.exp(-t/.022)+.55*Math.sin(TP*f*2.33*t)*Math.exp(-t/.011)+.5*Math.sin(TP*95*t)*Math.exp(-t/.02))}};
/* jeton : transitoire de bruit (pas de note) + tics inharmoniques ultra-courts + corps sourd sans hauteur */
const ck=(x,t0,a)=>{const i0=t0*sr|0,k=rr(.85,1.2),P=[[3100*k,.5,.0016],[4600*k,.45,.0012],[6300*k,.3,.0009],[2100*k,.35,.0025]],n=.05*sr|0;let lp=0,l2=0,l3=0;for(let i=0;i<n&&i0+i<x.length;i++){const t=i/sr,w=R()*2-1;lp+=(w-lp)*.55;l2+=(w-l2)*.08;l3+=(l2-l3)*.15;let v=(lp-l2)*1.6*Math.exp(-t/.0016)+l3*2.2*Math.exp(-t/.006);for(const[f,am,tau]of P)v+=am*Math.sin(TP*f*t+f)*Math.exp(-t/tau);x[i0+i]+=v*a}};
